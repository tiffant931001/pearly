/* --- magic v3: softer pink, cross-stitch heart --- */
.halftone{display:none}
.petT::before{background:#FDF0F6}.petT.lp-on::before{opacity:.92}.petT.lp-go::before{background:#F9E3EE;opacity:1}
.aura{width:220px;height:220px;margin:-110px 0 0 -110px;background:radial-gradient(closest-side,rgba(240,182,210,.5),rgba(244,200,222,.22) 60%,rgba(250,225,238,0))}
.petT.lp-go .aura{transform:scale(1.25)}
.motes i::before{filter:drop-shadow(0 0 1.5px rgba(226,140,186,.9))}
.motes i{width:10px;height:10px;left:-5px;top:-5px}
.softs path,.bloom path{filter:drop-shadow(0 0 2px #EDB3CF) drop-shadow(0 0 6px rgba(232,160,198,.5))}
.bloom .b0{width:150px;height:150px;left:-75px;top:-75px}
.petT.lp-on .pet{filter:drop-shadow(0 0 5px rgba(226,150,192,.4));animation:petglow2 1.6s ease-in-out .4s infinite}
@keyframes petglow2{50%{filter:drop-shadow(0 0 9px rgba(226,150,192,.55))}}
.stitchw{position:absolute;left:50%;top:58%;width:0;height:0;z-index:3;pointer-events:none}
.stitch{position:absolute;left:0;top:0;overflow:visible}
.stitch .st,.xc .cx{stroke:#fff;stroke-width:2.2;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 1px rgba(214,140,180,.7))}
.stitch .st{opacity:0}
.petT.lp-on .stitch .st{animation:sew .18s ease-out calc(var(--i) * 12ms) both}
@keyframes sew{from{opacity:0;transform:scale(.2)}to{opacity:.95;transform:none}}
.stitch .st{transform-box:fill-box;transform-origin:center}
.xc{position:absolute;width:28px;height:28px;opacity:0;overflow:visible}
.xc.c1{left:-170px;top:-120px}.xc.c2{left:140px;top:-40px}.xc.c3{left:-160px;top:60px}
.petT.lp-on .xc{animation:xtw 1.8s steps(4) .6s infinite}.petT.lp-on .xc.c2{animation-delay:1.2s}.petT.lp-on .xc.c3{animation-delay:.9s}
@keyframes xtw{0%,100%{opacity:0}30%,60%{opacity:.9}}
.stitchw{top:52%}.petT.lp-on .petw{transform:scale(.94) translateY(8px)}.xc.c1{left:-178px;top:-140px}.xc.c2{left:150px;top:30px}.xc.c3{left:-180px;top:70px}
.petT::before{background-color:#FBEAF2;background-image:linear-gradient(rgba(214,150,186,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(214,150,186,.32) 1px,transparent 1px);background-size:11px 11px;background-position:center center}
.petT.lp-go::before{background-color:#F6DCE8;background-image:linear-gradient(rgba(206,132,174,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(206,132,174,.4) 1px,transparent 1px);background-size:11px 11px;background-position:center center}
.petT::before{display:none}
.pxc{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.pet{aspect-ratio:823/722}.pshadow{display:none}.petT .petw{margin:30px 0 14px}
.petT{transition:background-color .6s ease}.petT.night{background:#E7E3F4}
.moodst{position:absolute;left:12px;top:12px;z-index:5;display:flex;flex-direction:column;gap:1px;pointer-events:none;transition:opacity .3s}
.moodst .mi{display:flex;align-items:center;gap:6px;font-size:15px;line-height:1.3}
.mdot{width:9px;height:9px;border-radius:50%;flex:none}
.tag.streak{right:10px;bottom:12px;left:auto;top:auto;background:var(--pk);font-size:12px;animation:sway 2.6s ease-in-out infinite}
.bubble.tkb.moodb{left:auto;right:10px;top:12px;transform:none;font-size:12px;padding:4px 9px 4px 7px;gap:6px;transform-origin:100% 0;animation:mpop .4s cubic-bezier(.3,1.5,.5,1) both}
.bubble.tkb.moodb.still{animation:none}
.bubble.tkb.moodb small{font-size:9px;padding:1px 4px}
@keyframes mpop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.petT.lp-on .moodst{opacity:.25}
.cat[data-sug]{box-shadow:inset 0 0 0 2.5px var(--line);background:var(--pk)}
.needl.syncf{color:#B4475F}
@media (prefers-reduced-motion: reduce){.tag.streak{animation:none}.bubble.tkb.moodb{animation:none}}

async function syncPull(manual){const c=syncCfg();if(!c.repo||!c.tok){if(manual){st.sync={ok:false,msg:"還沒填倉庫和金鑰"};render()}return}
  if(syncing)return;syncing=true;const H={Authorization:"Bearer "+c.tok,Accept:"application/vnd.github+json"};const base="https://api.github.com/repos/"+c.repo+"/contents/inbox";
  try{const r=await tf(base,{headers:H});let list=[];

  else if(a==="swDel"){const it=db.items.find(i=>i.id===b.dataset.id);if(!it)return;const idx=db.items.indexOf(it);db.items.splice(idx,1);save();render();sfx("undo");undoToast("已刪除這一筆",()=>{db.items.splice(idx,0,it)})}
  else if(a==="budAll"){st.budAll=!st.budAll;render()}
  else if(a==="anim"){const on=CRM();try{localStorage.setItem("pearly-anim",on?"on":"off")}catch(e){}window.PC&&PC.motion(on);render()}
  else if(a==="sfx"){SFX.on=!SFX.on;window.PC&&PC.sound(SFX.on);try{localStorage.setItem("pearly-sfx",SFX.on?"1":"0")}catch(e){}render();if(SFX.on)sfx("coin")}
  else if(a==="csv"){st.csv=!st.csv;render()}
  else if(a==="copy"){const t=$("#csvOut");const txt=toCSV();(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("已複製")).catch(()=>{t.focus();t.select();toast("請用系統選單複製")})}
  else if(a==="reseed"){db=seed();db.budgets=BUD0();save();st.month=null;toast("已載入範例資料");render()}
  else if(a==="clear"){st.confirmClear=true;render()}
  else if(a==="clearNo"){st.confirmClear=false;render()}
  else if(a==="clearYes"){db={sample:false,items:[],budgets:{total:0,cats:{},home:[]}};save();st.confirmClear=false;toast("已清除");render()}
});
document.addEventListener("click",e=>{if(e.target.closest("[data-act]")&&!["go","exp","mon","csv","copy","more","key","mcat","mtype","editAmt"].includes(e.target.closest("[data-act]").dataset.act)){db.sample=db.sample}} ,true);
intake();(()=>{let t=0;try{t=+localStorage.getItem(PAYKEY)||0}catch(e){}st.justPaid=!!(t&&Date.now()-t<PAYWIN);let h=0;try{h=+localStorage.getItem("pearly-lph")||0;if(h<3)localStorage.setItem("pearly-lph",String(h+1))}catch(e){}st.lpHint=h<3})();render();onOpen();setTimeout(()=>{const s=document.createElement("script");s.src="char11.js";document.head.appendChild(s)},30);setTimeout(()=>syncPull(false),400);
if(PROD&&"serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script></body></html>
